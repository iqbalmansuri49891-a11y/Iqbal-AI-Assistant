<!DOCTYPE html>
<html lang="hi">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1153244824920209"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#212121">
<title>Iqbal AI</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#212121;
  color:#fff;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   APP
========================= */

#app{
  width:100%;
  height:100%;
  display:flex;
  overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:270px;
  height:100%;
  background:#171717;
  border-right:1px solid #303030;
  display:flex;
  flex-direction:column;
  padding:10px;
  flex-shrink:0;
}

.new-chat{
  width:100%;
  background:transparent;
  color:#fff;
  border:1px solid #424242;
  border-radius:8px;
  padding:11px;
  text-align:left;
  margin-bottom:10px;
}

.new-chat:hover{
  background:#2a2a2a;
}

.search{
  width:100%;
  background:#212121;
  border:1px solid #3a3a3a;
  color:#fff;
  outline:none;
  border-radius:8px;
  padding:10px;
  margin-bottom:12px;
}

.history-title{
  color:#999;
  font-size:12px;
  padding:8px 10px;
}

.history{
  flex:1;
  overflow-y:auto;
}

.history-item{
  padding:10px;
  border-radius:7px;
  color:#ddd;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:3px;
}

.history-item:hover{
  background:#2a2a2a;
}

.profile-menu{
  border-top:1px solid #303030;
  padding-top:8px;
}

.profile-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#fff;
  padding:10px;
  border-radius:8px;
  text-align:left;
}

.profile-btn:hover{
  background:#2a2a2a;
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  height:55px;
  display:flex;
  align-items:center;
  padding:0 15px;
  border-bottom:1px solid #303030;
  background:#212121;
}

.mobile-menu{
  display:none;
  border:0;
  background:transparent;
  color:#fff;
  font-size:22px;
  margin-right:10px;
}

.logo-title{
  font-size:16px;
  font-weight:600;
}

/* =========================
   CHAT
========================= */

#chat-screen{
  height:100%;
  display:flex;
  flex-direction:column;
}

.chat-area{
  flex:1;
  overflow-y:auto;
  padding:25px 15px 130px;
}

.welcome{
  max-width:760px;
  margin:90px auto 30px;
  text-align:center;
}

.welcome h1{
  font-size:28px;
  margin-bottom:10px;
}

.welcome p{
  color:#aaa;
}

.messages{
  max-width:850px;
  margin:auto;
}

.message-row{
  display:flex;
  margin:20px 0;
}

.message-row.user{
  justify-content:flex-end;
}

.message{
  max-width:80%;
  padding:12px 15px;
  border-radius:14px;
  line-height:1.55;
  font-size:15px;
  white-space:pre-wrap;
  word-break:break-word;
}

.user .message{
  background:#303030;
}

.ai .message{
  background:transparent;
}

.voice-button{
  margin-top:6px;
  background:transparent;
  border:1px solid #444;
  color:#aaa;
  border-radius:8px;
  padding:5px 9px;
  font-size:12px;
}

/* =========================
   INPUT
========================= */

.input-area{
  position:absolute;
  bottom:0;
  left:270px;
  right:0;
  background:linear-gradient(
    transparent,
    #212121 25%
  );
  padding:35px 15px 15px;
}

.input-wrapper{
  max-width:850px;
  margin:auto;
  background:#2f2f2f;
  border:1px solid #454545;
  border-radius:25px;
  display:flex;
  align-items:center;
  padding:5px 7px;
}

.tool{
  border:0;
  background:transparent;
  color:#aaa;
  font-size:19px;
  width:38px;
  height:38px;
  border-radius:50%;
}

.tool:hover{
  background:#444;
  color:#fff;
}

#user-input{
  flex:1;
  min-width:0;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
  padding:9px 5px;
}

#user-input::placeholder{
  color:#999;
}

.send{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#111;
  font-weight:bold;
}

.send:disabled{
  opacity:.4;
}

.status{
  text-align:center;
  color:#999;
  font-size:12px;
  margin-bottom:5px;
}

/* =========================
   PROFILE
========================= */

#profile-screen{
  flex:1;
  overflow-y:auto;
  padding:30px 20px;
}

.profile-card{
  max-width:650px;
  margin:auto;
  background:#2a2a2a;
  border:1px solid #404040;
  border-radius:15px;
  padding:25px;
}

.avatar{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#10a37f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:15px;
}

.profile-name{
  font-size:22px;
  font-weight:600;
}

.profile-email{
  color:#999;
  margin:5px 0 25px;
}

.profile-option{
  width:100%;
  padding:14px;
  margin-top:8px;
  background:#333;
  color:#fff;
  border:1px solid #444;
  border-radius:9px;
  text-align:left;
}

.logout{
  background:#5b2525;
  border-color:#7a3030;
}

/* =========================
   LOGIN / SIGNUP
========================= */

#auth-screen{
  position:fixed;
  inset:0;
  background:#212121;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}

.auth-card{
  width:100%;
  max-width:390px;
  background:#2a2a2a;
  border:1px solid #444;
  border-radius:16px;
  padding:25px;
}

.auth-card h1{
  margin-top:0;
  text-align:center;
}

.auth-card p{
  color:#aaa;
  text-align:center;
  font-size:13px;
}

.auth-input{
  width:100%;
  background:#1f1f1f;
  border:1px solid #444;
  color:#fff;
  padding:12px;
  border-radius:8px;
  margin-top:10px;
  outline:none;
}

.auth-button{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#10a37f;
  color:#fff;
  font-weight:600;
}

.auth-secondary{
  background:#444;
}

.auth-switch{
  border:0;
  background:transparent;
  color:#10a37f;
  display:block;
  margin:15px auto 0;
}

.auth-message{
  color:#ff7777;
  text-align:center;
  font-size:13px;
  min-height:18px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .sidebar{
    position:fixed;
    left:-280px;
    top:0;
    z-index:1000;
    transition:.25s;
    box-shadow:5px 0 25px #000;
  }

  .sidebar.open{
    left:0;
  }

  .mobile-menu{
    display:block;
  }

  .input-area{
    left:0;
  }

  .message{
    max-width:90%;
  }

  .welcome{
    margin-top:70px;
  }

  .welcome h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN / SIGNUP
========================= -->

<div id="auth-screen">

  <div class="auth-card">

    <h1>Iqbal AI</h1>

    <p id="auth-title">
      Login करके Iqbal AI इस्तेमाल करें
    </p>

    <input
      id="auth-name"
      class="auth-input"
      type="text"
      placeholder="आपका नाम">

    <input
      id="auth-email"
      class="auth-input"
      type="email"
      placeholder="Email">

    <input
      id="auth-password"
      class="auth-input"
      type="password"
      placeholder="Password">

    <div id="auth-message" class="auth-message"></div>

    <button
      id="auth-main-btn"
      class="auth-button"
      onclick="authAction()">
      Login
    </button>

    <button
      class="auth-button auth-secondary"
      onclick="demoLogin()">
      Continue as Guest
    </button>

    <button
      class="auth-switch"
      onclick="toggleAuthMode()">
      Account नहीं है? Sign Up
    </button>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">

  <!-- Sidebar -->

  <aside class="sidebar" id="sidebar">

    <button
      class="new-chat"
      onclick="newChat()">
      ＋ New chat
    </button>

    <input
      class="search"
      id="search-input"
      placeholder="Search chats..."
      oninput="searchChats()">

    <div class="history-title">
      Chats
    </div>

    <div
      class="history"
      id="history">
    </div>

    <div class="profile-menu">

      <button
        class="profile-btn"
        onclick="showProfile()">
        👤 <span id="sidebar-name">Profile</span>
      </button>

    </div>

  </aside>


  <!-- Main -->

  <main class="main">

    <header class="topbar">

      <button
        class="mobile-menu"
        onclick="toggleSidebar()">
        ☰
      </button>

      <div class="logo-title">
        Iqbal AI
      </div>

    </header>


    <!-- CHAT -->

    <section id="chat-screen">

      <div class="chat-area" id="chat-area">

        <div
          class="welcome"
          id="welcome">

          <h1>What can I help with?</h1>

          <p>
            Iqbal AI से कुछ भी पूछें
          </p>

        </div>

        <div
          class="messages"
          id="messages">
        </div>

      </div>


      <div class="input-area">

        <div
          class="status"
          id="status">
        </div>

        <div class="input-wrapper">

          <label
            class="tool"
            title="Photo">
            📎
            <input
              type="file"
              id="image-input"
              accept="image/*"
              hidden
              onchange="handleImage(event)">
          </label>

          <button
            class="tool"
            id="mic-btn"
            onclick="startVoice()"
            title="Voice">
            🎤
          </button>

          <input
            id="user-input"
            type="text"
            placeholder="Message Iqbal AI..."
            onkeydown="if(event.key==='Enter') askAI()">

          <button
            id="send-btn"
            class="send"
            onclick="askAI()">
            ↑
          </button>

        </div>

      </div>

    </section>


    <!-- PROFILE -->

    <section
      id="profile-screen"
      class="hidden">

      <div class="profile-card">

        <div
          class="avatar"
          id="profile-avatar">
          I
        </div>

        <div
          class="profile-name"
          id="profile-name">
          User
        </div>

        <div
          class="profile-email"
          id="profile-email">
          Guest
        </div>

        <button
          class="profile-option"
          onclick="showChat()">
          💬 Back to Chat
        </button>

        <button
          class="profile-option"
          onclick="newChat()">
          ＋ New Chat
        </button>

        <button
          class="profile-option logout"
          onclick="logout()">
          🚪 Logout
        </button>

      </div>

    </section>

  </main>

</div>


<script>

/* =========================
   STATE
========================= */

let authMode = "login";
let user = null;
let selectedImage = null;
let recognition = null;
let isRecording = false;


/* =========================
   START
========================= */

window.addEventListener("load",function(){

  const saved =
    localStorage.getItem("iqbal_user");

  if(saved){

    try{
      user = JSON.parse(saved);
      startApp();
    }catch(e){
      localStorage.removeItem("iqbal_user");
    }

  }

});


/* =========================
   AUTH MODE
========================= */

function toggleAuthMode(){

  authMode =
    authMode === "login"
    ? "signup"
    : "login";

  const title =
    document.getElementById("auth-title");

  const button =
    document.getElementById("auth-main-btn");

  const switchBtn =
    document.querySelector(".auth-switch");

  const name =
    document.getElementById("auth-name");

  if(authMode==="signup"){

    title.textContent =
      "नया Iqbal AI Account बनाएं";

    button.textContent =
      "Sign Up";

    switchBtn.textContent =
      "Account है? Login";

    name.style.display =
      "block";

  }else{

    title.textContent =
      "Login करके Iqbal AI इस्तेमाल करें";

    button.textContent =
      "Login";

    switchBtn.textContent =
      "Account नहीं है? Sign Up";

    name.style.display =
      "block";

  }

  document.getElementById("auth-message").textContent="";

}


/* =========================
   LOGIN / SIGNUP
========================= */

function authAction(){

  const name =
    document.getElementById("auth-name").value.trim();

  const email =
    document.getElementById("auth-email").value.trim();

  const password =
    document.getElementById("auth-password").value;

  const msg =
    document.getElementById("auth-message");

  if(!email || !password){

    msg.textContent =
      "Email और Password भरें।";

    return;

  }

  if(!email.includes("@")){

    msg.textContent =
      "Valid email डालें।";

    return;

  }

  if(authMode==="signup" && !name){

    msg.textContent =
      "अपना नाम डालें।";

    return;

  }


  /* Local demo account */

  user = {

    name:
      name ||
      email.split("@")[0],

    email:email

  };

  localStorage.setItem(
    "iqbal_user",
    JSON.stringify(user)
  );

  startApp();

}


/* =========================
   GUEST
========================= */

function demoLogin(){

  user = {

    name:"Guest",

    email:"Guest Account"

  };

  localStorage.setItem(
    "iqbal_user",
    JSON.stringify(user)
  );

  startApp();

}


/* =========================
   START APP
========================= */

function startApp(){

  document
    .getElementById("auth-screen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  updateProfile();

  loadHistory();

}


/* =========================
   PROFILE
========================= */

function updateProfile(){

  document.getElementById(
    "sidebar-name"
  ).textContent = user.name;

  document.getElementById(
    "profile-name"
  ).textContent = user.name;

  document.getElementById(
    "profile-email"
  ).textContent = user.email;

  document.getElementById(
    "profile-avatar"
  ).textContent =
    user.name.charAt(0).toUpperCase();

}


/* =========================
   SCREENS
========================= */

function showProfile(){

  document
    .getElementById("chat-screen")
    .classList.add("hidden");

  document
    .getElementById("profile-screen")
    .classList.remove("hidden");

  closeSidebar();

}


function showChat(){

  document
    .getElementById("profile-screen")
    .classList.add("hidden");

  document
    .getElementById("chat-screen")
    .classList.remove("hidden");

}


/* =========================
   LOGOUT
========================= */

function logout(){

  if(!confirm("Logout करना है?")) return;

  localStorage.removeItem("iqbal_user");

  user = null;

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("auth-screen")
    .classList.remove("hidden");

  document.getElementById(
    "auth-password"
  ).value="";

}


/* =========================
   SIDEBAR
========================= */

function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList.toggle("open");

}


function closeSidebar(){

  document
    .getElementById("sidebar")
    .classList.remove("open");

}


/* =========================
   NEW CHAT
========================= */

function newChat(){

  document.getElementById(
    "messages"
  ).innerHTML="";

  document.getElementById(
    "welcome"
  ).style.display="block";

  showChat();

  closeSidebar();

  document.getElementById(
    "user-input"
  ).focus();

}


/* =========================
   MESSAGE
========================= */

function addMessage(text,type){

  const messages =
    document.getElementById("messages");

  const row =
    document.createElement("div");

  row.className =
    "message-row " + type;

  const bubble =
    document.createElement("div");

  bubble.className="message";

  bubble.textContent=text;

  row.appendChild(bubble);

  if(type==="ai"){

    const voice =
      document.createElement("button");

    voice.className="voice-button";

    voice.textContent="🔊 सुनें";

    voice.onclick=function(){

      speakAI(text);

    };

    row.appendChild(voice);

  }

  messages.appendChild(row);

  document.getElementById(
    "welcome"
  ).style.display="none";

  const area =
    document.getElementById("chat-area");

  area.scrollTop =
    area.scrollHeight;

}


/* =========================
   ASK AI
========================= */

async function askAI(){

  const input =
    document.getElementById("user-input");

  const send =
    document.getElementById("send-btn");

  const text =
    input.value.trim();

  if(!text && !selectedImage) return;

  let message =
    text;

  if(selectedImage && !message){

    message =
      "इस फोटो को समझाकर बताओ।";

  }

  addMessage(
    text || "🖼️ Photo",
    "user"
  );

  input.value="";

  send.disabled=true;

  document.getElementById(
    "status"
  ).textContent =
    "Iqbal AI सोच रहा है...";


  try{

    const body={
      message:message
    };

    if(selectedImage){

      body.image={
        data:selectedImage.data,
        mime_type:selectedImage.mime_type
      };

    }

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(body)

      });


    const raw =
      await response.text();

    let data;

    try{

      data=JSON.parse(raw);

    }catch(e){

      throw new Error(
        "Server response गलत है।"
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "AI response error"
      );

    }


    if(data.reply){

      addMessage(
        data.reply,
        "ai"
      );

      /* Voice */

      speakAI(data.reply);

      saveHistory(text || "Photo");

    }else{

      addMessage(
        "कोई जवाब नहीं मिला।",
        "ai"
      );

    }


  }catch(error){

    addMessage(
      "Error: "+error.message,
      "ai"
    );

  }finally{

    send.disabled=false;

    document.getElementById(
      "status"
    ).textContent="";

    selectedImage=null;

    document.getElementById(
      "image-input"
    ).value="";

    input.focus();

  }

}


/* =========================
   VOICE INPUT
========================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "इस browser में voice input उपलब्ध नहीं है।"
    );

    return;

  }

  if(isRecording){

    recognition.stop();

    return;

  }

  recognition =
    new SpeechRecognition();

  recognition.lang="hi-IN";

  recognition.continuous=false;

  recognition.interimResults=false;

  recognition.onstart=function(){

    isRecording=true;

    document.getElementById(
      "mic-btn"
    ).textContent="🔴";

    document.getElementById(
      "status"
    ).textContent="सुन रहा हूँ...";

  };

  recognition.onresult=function(event){

    const text =
      event.results[0][0].transcript;

    document.getElementById(
      "user-input"
    ).value=text;

    /* Voice input ke baad automatically send */

    askAI();

  };

  recognition.onerror=function(){

    isRecording=false;

    document.getElementById(
      "mic-btn"
    ).textContent="🎤";

    document.getElementById(
      "status"
    ).textContent="";

  };

  recognition.onend=function(){

    isRecording=false;

    document.getElementById(
      "mic-btn"
    ).textContent="🎤";

    document.getElementById(
      "status"
    ).textContent="";

  };

  recognition.start();

}


/* =========================
   AI VOICE
========================= */

function speakAI(text){

  if(!("speechSynthesis" in window)){

    return;

  }

  window.speechSynthesis.cancel();

  const clean =
    text
      .replace(/```[\s\S]*?```/g,"")
      .replace(/[*#_`]/g,"")
      .trim();

  if(!clean) return;

  const utterance =
    new SpeechSynthesisUtterance(clean);

  utterance.lang="hi-IN";

  utterance.rate=.9;

  utterance.pitch=1;

  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================
   IMAGE
========================= */

function handleImage(event){

  const file =
    event.target.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){

    alert("कृपया image चुनें।");

    return;

  }

  const reader =
    new FileReader();

  reader.onload=function(e){

    selectedImage={
      data:e.target.result.split(",")[1],
      mime_type:file.type
    };

    document.getElementById(
      "user-input"
    ).placeholder =
      "Photo के बारे में पूछें...";

  };

  reader.readAsDataURL(file);

}


/* =========================
   CHAT HISTORY
========================= */

function saveHistory(text){

  if(!text) return;

  let history =
    JSON.parse(
      localStorage.getItem("iqbal_history") ||
      "[]"
    );

  history.unshift(text);

  history =
    [...new Set(history)].slice(0,30);

  localStorage.setItem(
    "iqbal_history",
    JSON.stringify(history)
  );

  loadHistory();

}


function loadHistory(){

  const box =
    document.getElementById("history");

  const history =
    JSON.parse(
      localStorage.getItem("iqbal_history") ||
      "[]"
    );

  box.innerHTML="";

  history.forEach(function(item){

    const div =
      document.createElement("div");

    div.className="history-item";

    div.textContent=item;

    div.onclick=function(){

      document.getElementById(
        "user-input"
      ).value=item;

      closeSidebar();

      document.getElementById(
        "user-input"
      ).focus();

    };

    box.appendChild(div);

  });

}


function searchChats(){

  const query =
    document.getElementById(
      "search-input"
    ).value.toLowerCase();

  document
    .querySelectorAll(".history-item")
    .forEach(function(item){

      item.style.display =
        item.textContent
          .toLowerCase()
          .includes(query)
          ? "block"
          : "none";

    });

}

   STOP VOICE
========================= */

window.addEventListener(
  "beforeunload",
  function(){

    if("speechSynthesis" in window){

      speechSynthesis.cancel();

    }

  }
);

</script>
