<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b141a">
<title>Iqbal AI Assistant</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0b141a;color:#e9edef;margin:0;height:100vh;display:flex;flex-direction:column}
header{padding:10px 12px;background:#111b21;border-bottom:1px solid #222d34;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{background:#d4af37;color:#0b141a;font-weight:700;padding:4px 8px;border-radius:6px;font-size:14px;flex-shrink:0}
.title-text{font-size:15px;font-weight:700;color:#f3f4f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang-selector{display:flex;background:#202c33;border-radius:16px;padding:2px;gap:2px;flex-shrink:0}
.lang-btn{background:transparent;border:0;color:#8696a0;padding:4px 10px;border-radius:14px;font-size:11px;cursor:pointer;font-weight:600}
.lang-btn.active{background:#d4af37;color:#0b141a}

#login-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:#0b141a}
.login-card{background:#111b21;padding:25px;border-radius:16px;border:1px solid #222d34;max-width:380px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.login-card h2{color:#f3f4f6;margin-bottom:10px;font-size:20px}
.login-card p{color:#8696a0;font-size:13px;margin-bottom:20px}
.google-btn{background:#ffffff;color:#222d34;border:0;border-radius:24px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:0 2px 5px rgba(0,0,0,0.2)}

#app-screen{flex:1;display:flex;flex-direction:column;display:none}
#chat-container{flex:1;background:#0b141a;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.welcome-box{background:#111b21;padding:16px;border-radius:12px;border:1px solid #222d34;margin-bottom:10px}
.welcome-box h1{font-size:16px;color:#f3f4f6;margin:0 0 10px;line-height:1.5}
.suggestion-chips{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.chip{background:#202c33;padding:8px 12px;border-radius:8px;font-size:12px;color:#d4af37;cursor:pointer;width:fit-content;border:1px solid #222d34;text-align:left}
.message{padding:10px 14px;border-radius:12px;max-width:88%;line-height:1.5;font-size:14px;word-break:break-word;white-space:pre-wrap}
.user-message{background:#005c4b;color:#e9edef;align-self:flex-end;border-bottom-right-radius:3px}
.ai-message{background:#202c33;color:#e9edef;align-self:flex-start;border-bottom-left-radius:3px;border:1px solid #222d34}
.input-area{background:#111b21;padding:8px 10px;border-top:1px solid #222d34}
.input-box-wrapper{display:flex;align-items:center;background:#202c33;border-radius:22px;padding:3px 6px 3px 10px;gap:6px;border:1px solid #222d34}
input[type=text]{flex:1;background:transparent;border:0;outline:0;font-size:13px;color:#e9edef;padding:6px 0}
input[type=text]::placeholder{color:#8696a0}
.tool-btn{background:none;border:0;cursor:pointer;font-size:16px;color:#8696a0;padding:4px;display:flex}
.send-btn{background:#d4af37;color:#0b141a;border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.send-btn:disabled{opacity:.5}
.hidden{display:none}
.status{font-size:11px;color:#8696a0;text-align:center;padding:2px}
.user-info{font-size:12px;color:#d4af37;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">AI</div>
    <div class="title-text">Iqbal AI</div>
  </div>
  <div style="display:flex; align-items:center; gap:8px;">
    <div id="user-profile" class="user-info"></div>
    <div class="lang-selector">
      <button class="lang-btn active" id="btn-hi" onclick="setLang('hi')">हिंदी</button>
      <button class="lang-btn" id="btn-eng" onclick="setLang('eng')">Eng</button>
    </div>
  </div>
</header>

<div id="login-screen">
  <div class="login-card">
    <h2>Welcome / स्वागत है</h2>
    <p>Please enter your name to start.</p>
    <button class="google-btn" onclick="loginWithGoogle()">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.16 21.3 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.14 0 9.87 0 12s.43 3.86 1.18 5.38l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.16 2.7 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
      Sign in
    </button>
  </div>
</div>

<div id="app-screen">
  <div id="chat-container">
    <div class="welcome-box" id="welcome-section">
      <h1 id="welcome-text">नमस्ते! आज हम क्या नया सीख सकते हैं?</h1>
      <div class="suggestion-chips">
        <button class="chip" onclick="setQuery('एक शानदार नोटबुक आइडिया लिखो')">📓 एक शानदार नोटबुक आइडिया लिखो</button>
        <button class="chip" onclick="setQuery('मेरे लिए एक खूबसूरत इमेज का आइडिया बताओ')">🖼️ खूबसूरत इमेज का आइडिया</button>
        <button class="chip" onclick="setQuery('आज का दिन शानदार बनाने के लिए कुछ टिप्स दो')">✨ आज का दिन शानदार बनाने के टिप्स</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div id="status" class="status"></div>
    <div class="input-box-wrapper">
      <label for="file-input" class="tool-btn" title="फाइल">📎</label>
      <input class="hidden" type="file" id="file-input" onchange="handleFile(event)">

      <label for="gallery-input" class="tool-btn" title="गैलरी">🖼️</label>
      <input class="hidden" type="file" id="gallery-input" accept="image/*" onchange="handleGallery(event)">

      <input type="text" id="user-input" placeholder="यहाँ अपना सवाल लिखें..."
             onkeydown="if(event.key==='Enter') askAI()">
      <button id="send-btn" class="send-btn" onclick="askAI()">➔</button>
    </div>
  </div>
</div>

<script>
let currentLang = 'hi';
let userName = '';

window.onload = function() {
  let savedUser = localStorage.getItem('iqbal_ai_user');
  // अगर पुराना डेटा जीमेल वाला है, तो उसे साफ़ कर देगा
  if(!savedUser || savedUser.includes('@')) {
    localStorage.removeItem('iqbal_ai_user');
    savedUser = null;
  }
  
  if(savedUser) {
    userName = savedUser;
    showAppScreen();
  }
};

function loginWithGoogle(){
  let name = prompt("अपना नाम लिखें / Enter your name:");
  if(name && name.trim() !== ""){
    userName = name.trim();
    localStorage.setItem('iqbal_ai_user', userName);
    showAppScreen();
  }
}

function showAppScreen(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'flex';
  document.getElementById('user-profile').textContent = "👤 " + userName;
}

function setLang(lang){
  currentLang = lang;
  document.getElementById('btn-hi').classList.toggle('active', lang === 'hi');
  document.getElementById('btn-eng').classList.toggle('active', lang === 'eng');
  
  const welcomeText = document.getElementById('welcome-text');
  if(lang === 'eng'){
    welcomeText.innerHTML = "Hello " + (userName || "") + "! What can we build or learn today?";
    document.getElementById('user-input').placeholder = "Ask anything in English...";
  } else {
    welcomeText.innerHTML = "नमस्ते " + (userName || "") + "! आज हम क्या नया सीख सकते हैं?";
    document.getElementById('user-input').placeholder = "यहाँ अपना सवाल लिखें...";
  }
}

function escapeHTML(text){
  return text.replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
  });
}

function addMessage(text, type){
  const chat = document.getElementById("chat-container");
  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerHTML = escapeHTML(text);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function setQuery(text){
  document.getElementById("user-input").value = text;
  askAI();
}

function setStatus(text){
  document.getElementById("status").textContent = text || "";
}

async function askAI(){
  const input = document.getElementById("user-input");
  const button = document.getElementById("send-btn");
  const welcome = document.getElementById("welcome-section");
  const userText = input.value.trim();

  if(!userText) return;
  if(welcome) welcome.style.display = "none";

  addMessage(userText, "user-message");
  input.value = "";
  button.disabled = true;
  setStatus(currentLang === 'eng' ? "Generating response..." : "जवाब तैयार किया जा रहा है...");

  try{
    const response = await fetch('/api/chat', {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: userText })
    });

    const data = await response.json();

    if(!response.ok){
      addMessage("Error: " + (data.error || "Something went wrong"), "ai-message");
      return;
    }

    if(data.reply){
      addMessage(data.reply, "ai-message");
    } else {
      addMessage("कोई उत्तर नहीं मिला।", "ai-message");
    }
  } catch(error) {
    addMessage("Network Error: " + error.message, "ai-message");
  } finally {
    button.disabled = false;
    setStatus("");
    input.focus();
  }
}

function handleFile(event){
  const file = event.target.files[0];
  if(!file) return;
  document.getElementById("welcome-section").style.display="none";
  addMessage("📁 फाइल जोड़ी गई: " + file.name, "user-message");
}

function handleGallery(event){
  const file = event.target.files[0];
  if(!file) return;
  document.getElementById("welcome-section").style.display="none";
  addMessage("🖼️ फोटो चुनी गई: " + file.name, "user-message");
}
</script>
</body>
</html>
