<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iqbal AI Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        #chat-container {
            flex: 1;
            background: white;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }
        .user-message {
            background: #d1e7dd;
            text-align: right;
        }
        .ai-message {
            background: #f8d7da;
            text-align: left;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>

    <h2>Iqbal AI Assistant</h2>
    
    <div id="chat-container">
        <div class="message ai-message">नमस्ते! मैं आपका Iqbal AI Assistant हूँ। बताइए मैं आपकी क्या मदद कर सकता हूँ?</div>
    </div>

    <div class="input-group">
        <input type="text" id="user-input" placeholder="यहाँ अपना सवाल लिखें...">
        <button onclick="askGemini()">भेजें</button>
    </div>

    <script>
        // आपकी आधिकारिक Gemini API Key
        const API_KEY = 'AQ.Ab8RN6LGPuzHXPd25c9LOHtS_Agcd8a4UzzvsphB4U1Lq1RcRw';

        async function askGemini() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const userText = inputField.value.trim();

            if (!userText) return;

            // यूजर का मैसेज स्क्रीन पर दिखाएं
            chatContainer.innerHTML += `<div class="message user-message">${userText}</div>`;
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Gemini API को रिक्वेस्ट भेजना
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: userText }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatContainer.innerHTML += `<div class="message ai-message">${aiReply}</div>`;
                } else {
                    chatContainer.innerHTML += `<div class="message ai-message">क्षमा करें, कोई उत्तर नहीं मिला।</div>`;
                }
            } catch (error) {
                console.error("Error:", error);
                chatContainer.innerHTML += `<div class="message ai-message">कनेक्शन में त्रुटि हुई है। कृपया पुनः प्रयास करें।</div>`;
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
