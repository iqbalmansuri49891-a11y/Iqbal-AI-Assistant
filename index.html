<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iqbal AI Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 12px 16px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            background: #ffffff;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #chat-container {
            flex: 1;
            background: #ffffff;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .welcome-box {
            text-align: left;
            margin-top: 10px;
        }
        .welcome-box h1 {
            font-size: 24px;
            color: #1f1f1f;
            margin-bottom: 20px;
        }
        .suggestion-chips {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .chip {
            background: #f0f4f9;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            color: #444;
            cursor: pointer;
            width: fit-content;
            border: none;
        }
        .message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.4;
            font-size: 15px;
            word-break: break-word;
        }
        .user-message {
            background: #d3e3fd;
            color: #041e49;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background: #f0f4f9;
            color: #1f1f1f;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .input-area {
            background: #ffffff;
            padding: 10px 12px;
            border-top: 1px solid #eaeaea;
        }
        .input-box-wrapper {
            display: flex;
            align-items: center;
            background: #f0f4f9;
            border-radius: 24px;
            padding: 4px 6px 4px 10px;
            gap: 6px;
        }
        .input-box-wrapper input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 15px;
            color: #333;
            padding: 8px 0;
            min-width: 50px;
        }
        .tool-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 17px;
            color: #555;
            padding: 4px;
            display: flex;
            align-items: center;
        }
        .send-btn {
            background: #0b57d0;
            color: white;
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        #file-input, #camera-input, #gallery-input {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <span>Iqbal AI Assistant</span>
        <span style="font-size: 13px; background: #e8f0fe; color: #1967d2; padding: 3px 8px; border-radius: 10px;">Gemini 1.5</span>
    </header>
    
    <div id="chat-container">
        <div class="welcome-box" id="welcome-section">
            <h1>नमस्ते, Iqbal!<br>आज हमें क्या करना चाहिए?</h1>
            <div class="suggestion-chips">
                <button class="chip" onclick="setQuery('एक शानदार नोटबुक आइडिया लिखो')">📓 नोटबुक में नोट्स लिखो</button>
                <button class="chip" onclick="setQuery('मेरे लिए एक खूबसूरत इमेज का आइडिया बताओ')">🖼️ इमेज बनाएं</button>
                <button class="chip" onclick="setQuery('आज का दिन शानदार बनाने के लिए कुछ टिप्स दो')">✨ मेरा दिन शानदार बना दो</button>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-box-wrapper">
            <label for="file-input" class="tool-btn" title="फाइल">📎</label>
            <input type="file" id="file-input" onchange="handleFile(event)">

            <label for="gallery-input" class="tool-btn" title="गैलरी">🖼️</label>
            <input type="file" id="gallery-input" accept="image/*" onchange="handleGallery(event)">

            <label for="camera-input" class="tool-btn" title="कैमरा">📷</label>
            <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleCamera(event)">

            <input type="text" id="user-input" placeholder="Gemini से पूछें..." onkeydown="if(event.key === 'Enter') askGemini()">
            
            <button class="send-btn" onclick="askGemini()">➔</button>
        </div>
    </div>

    <script>
        // Aapki nayi API Key yahan set hai
        const API_KEY = 'AQ.Ab8RN6ILXAKvKy26VW-XLBLodZD2-xwh8qYLfM4B8iw0oV_cDQ';

        function setQuery(text) {
            document.getElementById('user-input').value = text;
            askGemini();
        }

        async function askGemini() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const welcomeSection = document.getElementById('welcome-section');
            const userText = inputField.value.trim();

            if (!userText) return;

            if (welcomeSection) {
                welcomeSection.style.display = 'none';
            }

            chatContainer.innerHTML += `<div class="message user-message">${userText}</div>`;
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: userText }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatContainer.innerHTML += `<div class="message ai-message">${aiReply}</div>`;
                } else if (data.error) {
                    chatContainer.innerHTML += `<div class="message ai-message">API Error: ${data.error.message}</div>`;
                } else {
                    chatContainer.innerHTML += `<div class="message ai-message">Kshama karein, koi uttar nahi mila.</div>`;
                }
            } catch (error) {
                console.error("Error:", error);
                chatContainer.innerHTML += `<div class="message ai-message">Network Error: ${error.message}</div>`;
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleFile(event) {
            const file = event.target.files[0];
            if (file) {
                const chatContainer = document.getElementById('chat-container');
                document.getElementById('welcome-section').style.display = 'none';
                chatContainer.innerHTML += `<div class="message user-message">📁 File jodi gayi: ${file.name}</div>`;
                chatContainer.innerHTML += `<div class="message ai-message">File (${file.name}) mil gayi hai. Is par kya karna hai?</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function handleGallery(event) {
            const file = event.target.files[0];
            if (file) {
                const chatContainer = document.getElementById('chat-container');
                document.getElementById('welcome-section').style.display = 'none';
                chatContainer.innerHTML += `<div class="message user-message">🖼️ [Gallery photo chuni gayi]</div>`;
                chatContainer.innerHTML += `<div class="message ai-message">Image aa gayi hai! Iske baare mein kya janna chahte hain?</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function handleCamera(event) {
            const file = event.target.files[0];
            if (file) {
                const chatContainer = document.getElementById('chat-container');
                document.getElementById('welcome-section').style.display = 'none';
                chatContainer.innerHTML += `<div class="message user-message">📷 [Camera photo li gayi]</div>`;
                chatContainer.innerHTML += `<div class="message ai-message">Photo capture ho gayi hai! Bataiye aage kya karna hai?</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }
    </script>
</body>
</html>
