<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b141a">
<title>Iqbal AI Assistant</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0b141a;color:#e9edef;margin:0;height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;background:#111b21;border-bottom:1px solid #222d34;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.logo{background:#d4af37;color:#0b141a;font-weight:700;padding:6px 12px;border-radius:8px;font-size:16px}
.title-text{font-size:18px;font-weight:700;color:#f3f4f6}
.lang-selector{display:flex;background:#202c33;border-radius:20px;padding:3px;gap:3px}
.lang-btn{background:transparent;border:0;color:#8696a0;padding:5px 12px;border-radius:16px;font-size:12px;cursor:pointer;font-weight:600}
.lang-btn.active{background:#d4af37;color:#0b141a}
#chat-container{flex:1;background:#0b141a;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.welcome-box{background:#111b21;padding:20px;border-radius:12px;border:1px solid #222d34;margin-bottom:10px}
.welcome-box h1{font-size:18px;color:#f3f4f6;margin:0 0 10px;line-height:1.6}
.suggestion-chips{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.chip{background:#202c33;padding:10px 14px;border-radius:10px;font-size:13px;color:#d4af37;cursor:pointer;width:fit-content;border:1px solid #222d34;text-align:left}
.message{padding:10px 14px;border-radius:12px;max-width:88%;line-height:1.6;font-size:14px;word-break:break-word;white-space:pre-wrap}
.user-message{background:#005c4b;color:#e9edef;align-self:flex-end;border-bottom-right-radius:3px}
.ai-message{background:#202c33;color:#e9edef;align-self:flex-start;border-bottom-left-radius:3px;border:1px solid #222d34}
.input-area{background:#111b21;padding:10px 12px;border-top:1px solid #222d34}
.input-box-wrapper{display:flex;align-items:center;background:#202c33;border-radius:24px;padding:4px 8px 4px 12px;gap:6px;border:1px solid #222d34}
input[type=text]{flex:1;background:transparent;border:0;outline:0;font-size:14px;color:#e9edef;padding:8px 0}
input[type=text]::placeholder{color:#8696a0}
.tool-btn{background:none;border:0;cursor:pointer;font-size:18px;color:#8696a0;padding:5px;display:flex}
.send-btn{background:#d4af37;color:#0b141a;border:0;border-radius:50%;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.send-btn:disabled{opacity:.5}
.hidden{display:none}
.status{font-size:11px;color:#8696a0;text-align:center;padding:4px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">AI</div>
    <div class="title-text">Iqbal AI Assistant</div>
  </div>
  <div class="lang-selector">
    <button class="lang-btn active" id="btn-hi" onclick="setLang('hi')">हिंदी</button>
    <button class="lang-btn" id="btn-eng" onclick="setLang('eng')">English</button>
  </div>
</header>

<div id="chat-container">
  <div class="welcome-box" id="welcome-section">
    <h1 id="welcome-text">नमस्ते! आज हम क्या नया सीख सकते हैं?</h1>
    <div class="suggestion-chips">
      <button class="chip" onclick="setQuery('एक शानदार नोटबुक आइडिया लिखो')">📓 एक शानदार नोटबुक आइडिया लिखो</button>
      <button class="chip" onclick="setQuery('मेरे लिए एक खूबसूरत इमेज का आइडिया बताओ')">🖼️ खूबसूरत इमेज का आइडिया</button>
      <button class="chip" onclick="setQuery('आज का दिन शानदार बनाने के लिए कुछ टिप्स दो')">✨ आज का दिन शानदार बनाने के टिप्स</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div id="status" class="status"></div>
  <div class="input-box-wrapper">
    <label for="file-input" class="tool-btn" title="फाइल">📎</label>
    <input class="hidden" type="file" id="file-input" onchange="handleFile(event)">

    <label for="gallery-input" class="tool-btn" title="गैलरी">🖼️</label>
    <input class="hidden" type="file" id="gallery-input" accept="image/*" onchange="handleGallery(event)">

    <input type="text" id="user-input" placeholder="यहाँ अपना सवाल लिखें..."
           onkeydown="if(event.key==='Enter') askOpenAI()">
    <button id="send-btn" class="send-btn" onclick="askOpenAI()">➔</button>
  </div>
</div>

<script>
let currentLang = 'hi';

function setLang(lang){
  currentLang = lang;
  document.getElementById('btn-hi').classList.toggle('active', lang === 'hi');
  document.getElementById('btn-eng').classList.toggle('active', lang === 'eng');
  
  const welcomeText = document.getElementById('welcome-text');
  if(lang === 'eng'){
    welcomeText.innerHTML = "Hello! What can we build or learn today?";
    document.getElementById('user-input').placeholder = "Ask anything in English...";
  } else {
    welcomeText.innerHTML = "नमस्ते! आज हम क्या नया सीख सकते हैं?";
    document.getElementById('user-input').placeholder = "यहाँ अपना सवाल लिखें...";
  }
}

function escapeHTML(text){
  return text.replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
  });
}

function addMessage(text, type){
  const chat = document.getElementById("chat-container");
  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerHTML = escapeHTML(text);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function setQuery(text){
  document.getElementById("user-input").value = text;
  askOpenAI();
}

function setStatus(text){
  document.getElementById("status").textContent = text || "";
}

async function askOpenAI(){
  const input = document.getElementById("user-input");
  const button = document.getElementById("send-btn");
  const welcome = document.getElementById("welcome-section");
  const userText = input.value.trim();

  if(!userText) return;
  if(welcome) welcome.style.display = "none";

  addMessage(userText, "user-message");
  input.value = "";
  button.disabled = true;
  setStatus(currentLang === 'eng' ? "Generating response..." : "जवाब तैयार किया जा रहा है...");

  try{
    const API_KEY = "Sk-proj-GqWATdALqmz1lykEZMi3qdFe6ryXGfIhTH0GqVKNZSeo5meZykcYjdzb1jpg0V4P_X7s2Ly7aAT3BlbkFJSyOtAPIJ2W3kxBSgvXC8FA8L6YRTn93nzCzMeR2sGIvn-BmJWuO17oyf-CNWJhwKtHOGF22okA".trim();
    const ENDPOINT = "https://api.openai.com/v1/chat/completions";

    const response = await fetch(ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [{ role: "user", content: userText }]
      })
    });

    const data = await response.json();

    if(!response.ok){
      const msg = data?.error?.message || "API Error";
      addMessage("Error: " + msg, "ai-message");
      return;
    }

    const reply = data?.choices?.[0]?.message?.content?.trim();
    if(reply){
      addMessage(reply, "ai-message");
    } else {
      addMessage("कोई उत्तर नहीं मिला।", "ai-message");
    }
  } catch(error) {
    addMessage("Network Error: " + error.message, "ai-message");
  } finally {
    button.disabled = false;
    setStatus("");
    input.focus();
  }
}

function handleFile(event){
  const file = event.target.files[0];
  if(!file) return;
  document.getElementById("welcome-section").style.display="none";
  addMessage("📁 फाइल जोड़ी गई: " + file.name, "user-message");
}

function handleGallery(event){
  const file = event.target.files[0];
  if(!file) return;
  document.getElementById("welcome-section").style.display="none";
  addMessage("🖼️ फोटो चुनी गई: " + file.name, "user-message");
}
</script>
</body>
</html>
