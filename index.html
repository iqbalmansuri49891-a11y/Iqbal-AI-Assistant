<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Iqbal AI Assistant</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f8f9fa;margin:0;height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;background:#fff;border-bottom:1px solid #eaeaea;display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700;color:#333}
.badge{font-size:13px;background:#e8f0fe;color:#1967d2;padding:4px 9px;border-radius:12px}
#chat-container{flex:1;background:#fff;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.welcome-box h1{font-size:24px;color:#1f1f1f;margin:10px 0 20px}
.suggestion-chips{display:flex;flex-direction:column;gap:8px}
.chip{background:#f0f4f9;padding:11px 16px;border-radius:18px;font-size:14px;color:#444;cursor:pointer;width:fit-content;border:0}
.message{padding:10px 14px;border-radius:12px;max-width:88%;line-height:1.5;font-size:15px;word-break:break-word;white-space:pre-wrap}
.user-message{background:#d3e3fd;color:#041e49;align-self:flex-end;border-bottom-right-radius:3px}
.ai-message{background:#f0f4f9;color:#1f1f1f;align-self:flex-start;border-bottom-left-radius:3px}
.input-area{background:#fff;padding:10px 12px;border-top:1px solid #eaeaea}
.input-box-wrapper{display:flex;align-items:center;background:#f0f4f9;border-radius:24px;padding:4px 6px 4px 10px;gap:5px}
input[type=text]{flex:1;background:transparent;border:0;outline:0;font-size:15px;color:#333;padding:8px 0;min-width:50px}
.tool-btn{background:none;border:0;cursor:pointer;font-size:18px;color:#555;padding:5px;display:flex}
.send-btn{background:#0b57d0;color:#fff;border:0;border-radius:50%;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.send-btn:disabled{opacity:.5}
.hidden{display:none}
.status{font-size:12px;color:#666;text-align:center;padding:4px}
</style>
</head>
<body>

<header>
  <span>Iqbal AI Assistant</span>
  <span class="badge">Gemini Flash</span>
</header>

<div id="chat-container">
  <div class="welcome-box" id="welcome-section">
    <h1>नमस्ते, Iqbal!<br>आज हमें क्या करना चाहिए?</h1>
    <div class="suggestion-chips">
      <button class="chip" onclick="setQuery('एक शानदार नोटबुक आइडिया लिखो')">📓 नोटबुक में नोट्स लिखो</button>
      <button class="chip" onclick="setQuery('मेरे लिए एक खूबसूरत इमेज का आइडिया बताओ')">🖼️ इमेज बनाएं</button>
      <button class="chip" onclick="setQuery('आज का दिन शानदार बनाने के लिए कुछ टिप्स दो')">✨ मेरा दिन शानदार बना दो</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div id="status" class="status"></div>
  <div class="input-box-wrapper">
    <label for="file-input" class="tool-btn" title="फाइल">📎</label>
    <input class="hidden" type="file" id="file-input" onchange="handleFile(event)">

    <label for="gallery-input" class="tool-btn" title="गैलरी">🖼️</label>
    <input class="hidden" type="file" id="gallery-input" accept="image/*" onchange="handleGallery(event)">

    <label for="camera-input" class="tool-btn" title="कैमरा">📷</label>
    <input class="hidden" type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleCamera(event)">

    <input type="text" id="user-input" placeholder="Gemini से पूछें..."
           onkeydown="if(event.key==='Enter') askGemini()">
    <button id="send-btn" class="send-btn" onclick="askGemini()">➔</button>
  </div>
</div>

<script>
// OAuth Credentials & Config
const CREDENTIAL = "AQ.Ab8RN6J8U1hrEY9PCH8oOnWLaw6YhPWJxeAMslcer7aCihOtCA";
const MODEL = "gemini-3.8-flash";
const ENDPOINT = "https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent";

function escapeHTML(text){
  return text.replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
  });
}

function addMessage(text, type){
  const chat = document.getElementById("chat-container");
  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerHTML = escapeHTML(text);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function setQuery(text){
  document.getElementById("user-input").value = text;
  askGemini();
}

function setStatus(text){
  document.getElementById("status").textContent = text || "";
}

async function askGemini(){
  const input = document.getElementById("user-input");
  const button = document.getElementById("send-btn");
  const welcome = document.getElementById("welcome-section");
  const userText = input.value.trim();

  if(!userText) return;

  if(welcome) welcome.style.display = "none";

  addMessage(userText, "user-message");
  input.value = "";
  button.disabled = true;
  setStatus("Gemini जवाब तैयार कर रहा है...");

  try{
    // OAuth token format handling for secure header injection
    const authHeader = CREDENTIAL.startsWith("AQ.") ? "Bearer " + CREDENTIAL : "Bearer " + CREDENTIAL;

    const response = await fetch(ENDPOINT, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization": authHeader
      },
      body:JSON.stringify({
        contents:[{
          role:"user",
          parts:[{text:userText}]
        }]
      })
    });

    const data = await response.json();

    if(!response.ok){
      const msg = data?.error?.message || ("HTTP Error " + response.status);
      addMessage("API Error: " + msg, "ai-message");
      return;
    }

    const reply = data?.candidates?.[0]?.content?.parts
      ?.map(p => p.text || "")
      .join("")
      .trim();

    if(reply){
      addMessage(reply, "ai-message");
    }else{
      addMessage("क्षमा करें, कोई उत्तर नहीं मिला।", "ai-message");
    }
  }catch(error){
    addMessage("Network Error: " + error.message, "ai-message");
  }finally{
    button.disabled = false;
    setStatus("");
    input.focus();
  }
}

function handleFile(event){
  const file = event.target.files[0];
  if(!file) return;
  document.getElementById("welcome-section").style.display="none";
  addMessage("📁 File जोड़ी गई: " + file.name, "user-message");
  addMessage("File मिल गई है।", "ai-message");
}

function handleGallery(event){
  const file = event.target.files[0];
  if(!file) return;
  document.getElementById("welcome-section").style.display="none";
  addMessage("🖼️ Gallery photo चुनी गई: " + file.name, "user-message");
  addMessage("Photo मिल गई है।", "ai-message");
}

function handleCamera(event){
  const file = event.target.files[0];
  if(!file) return;
  document.getElementById("welcome-section").style.display="none";
  addMessage("📷 Camera photo ली गई: " + file.name, "user-message");
  addMessage("Photo capture हो गई है।", "ai-message");
}
</script>
</body>
</html>
